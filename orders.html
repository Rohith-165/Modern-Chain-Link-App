<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Modern Chain Link Company</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/orders.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="pageHeader flexBetween">
        <div>
            <h1><i class="fa-solid fa-list-check"></i> Manage Orders</h1>
            <p>View, search, and filter customer fencing orders</p>
        </div>
        <div class="flexGap">
            <button type="button" onclick="exportOrdersToExcel()" class="btn-primary btn-sm" style="background: #16a34a; border: none; color: white;">
                <i class="fa-solid fa-file-excel"></i> Export to Excel
            </button>
            <button onclick="location.href='add-order.html'" class="btn-outline btn-sm" style="color:white; border-color:white;">
                <i class="fa-solid fa-plus"></i> New Order
            </button>
        </div>
    </header>

    <!-- Controls Section (Search & Filter) -->
    <section class="controlsSection mt20">
        <div class="grid-responsive-2">
            <div class="searchContainer">
                <i class="fa-solid fa-magnifying-glass searchIcon"></i>
                <input type="text" id="searchInput" placeholder="Search by Order ID, Customer Name, or Phone..." class="searchInput">
            </div>

            <div class="filterContainer flexGap">
                <div style="flex: 1; display: flex; align-items: center; position: relative;">
                    <i class="fa-solid fa-filter filterIcon"></i>
                    <select id="statusFilter" class="statusFilter" style="width: 100%;">
                        <option value="All">All Active Orders</option>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Trash">🗑️ Trash Vault (30 Days)</option>
                    </select>
                </div>
                <button type="button" onclick="exportOrdersToExcel()" class="btn-sm primaryBtn" style="background: #16a34a; white-space: nowrap;">
                    <i class="fa-solid fa-file-excel"></i> Excel
                </button>
            </div>
        </div>
    </section>

    <!-- Order Summary Cards -->
    <section class="summarySection mt20">
        <div class="grid2">
            <div class="summaryCard app-card textCenter">
                <p><i class="fa-solid fa-layer-group color-primary"></i> Total Orders</p>
                <h2 id="totalOrderCount">0</h2>
            </div>

            <div class="summaryCard app-card textCenter">
                <p><i class="fa-solid fa-filter-circle-dollar color-secondary"></i> Showing</p>
                <h2 id="filteredOrderCount">0</h2>
            </div>
        </div>
    </section>

    <!-- Orders List Container -->
    <section class="ordersSection mt20 mb30">
        <div id="ordersContainer" class="ordersGrid">
            <div class="emptyCard textCenter app-card">
                <i class="fa-solid fa-inbox color-primary emptyIcon"></i>
                <p>No Orders Found</p>
            </div>
        </div>
    </section>

</div>

<!-- Floating Add Button -->
<button class="fabButton" onclick="location.href='add-order.html'" title="Add New Order">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- Bottom Navigation -->
<nav class="bottomNavigation">
    <a href="home.html" class="navItem">
        <i class="fa-solid fa-house"></i>
        <small>Home</small>
    </a>
    <a href="orders.html" class="navItem active">
        <i class="fa-solid fa-list-check"></i>
        <small>Orders</small>
    </a>
    <a href="stock.html" class="navItem">
        <i class="fa-solid fa-boxes-stacked"></i>
        <small>Stock</small>
    </a>
    <a href="customers.html" class="navItem">
        <i class="fa-solid fa-users"></i>
        <small>Customers</small>
    </a>
    <a href="profile.html" class="navItem">
        <i class="fa-solid fa-user"></i>
        <small>Profile</small>
    </a>
</nav>

<!-- Password Authorization Modal for Deletion -->
<div id="deletePasswordModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; padding: 15px;">
    <div class="modalContent app-card" style="max-width: 400px; width: 100%; background: var(--bg-surface); padding: 25px; border-radius: var(--radius-lg); box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div class="flexBetween mb15">
            <h3 style="color: var(--danger-color); font-size: 18px;"><i class="fa-solid fa-lock"></i> Security Authentication</h3>
            <button type="button" onclick="closeDeletePasswordModal()" style="background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted);">&times;</button>
        </div>
        <p style="font-size: 14px; margin-bottom: 15px; color: var(--text-main);">
            To confirm deletion of <strong id="deleteModalOrderId">Order</strong>, please enter your account password:
        </p>
        <div class="form-group mb15">
            <input type="password" id="deletePasscodeInput" placeholder="Enter password (e.g. modern@123)" style="width: 100%; padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-color);" onkeyup="if(event.key==='Enter') submitDeleteOrderPassword()">
            <span id="deletePasscodeError" style="color: var(--danger-color); font-size: 12px; display: block; margin-top: 5px;"></span>
        </div>
        <div class="flexBetween flexGap mt20">
            <button type="button" class="btn-secondary btn-sm" onclick="closeDeletePasswordModal()">Cancel</button>
            <button type="button" class="btn-danger btn-sm" onclick="submitDeleteOrderPassword()" style="background: var(--danger-color); color: white; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600;">
                <i class="fa-solid fa-trash"></i> Confirm Delete
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/navigation.js"></script>
<script src="js/orders.js"></script>

</body>

</html>
