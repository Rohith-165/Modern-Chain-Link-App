<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Modern Chain Link Company</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container flexCenter">
    <div class="loginContainer">
        <!-- Company Logo -->
        <img src="assets/images/logo.png" alt="Modern Chain Link Company" class="logo">

        <!-- Company Name -->
        <h1>Modern Chain Link Company</h1>
        <p class="welcomeText">Welcome Back!</p>

        <!-- Login Card -->
        <div class="loginCard app-card mt20">
            <h2><i class="fa-solid fa-right-to-bracket color-primary"></i> Admin Login</h2>

            <!-- Username -->
            <div class="form-group mt20">
                <label for="username"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="username" placeholder="Kumar@modernchainlink.com" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <div class="passwordContainer">
                    <input type="password" id="password" placeholder="Enter Password" required>
                    <button type="button" id="togglePassword" class="btn-icon">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <p id="errorMessage" class="errorMessage mt10"></p>

            <!-- Login Button -->
            <button id="loginBtn" class="primaryBtn mt20">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </div>

        <!-- Footer -->
        <p class="footerText mt30 textCenter">
            © 2026 Modern Chain Link Company
        </p>
    </div>
</div>

<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>

</html>
